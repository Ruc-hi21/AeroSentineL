<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AeroSentinel engine model</title>
  <link rel="stylesheet" href="./style.css?v=3.0.1" />
</head>
<body>
  <div id="app" class="mode-twin">
    <canvas id="gl" aria-label="3D cutaway of the turbofan with sensor locations"></canvas>
    <canvas id="lines" aria-hidden="true"></canvas>

    <div id="hud">
      <header class="top">
        <div class="id"><b id="unit-name">Engine</b><div id="unit-meta"></div></div>
        <div class="cycle"><div class="v" id="cycle"></div><div class="m" id="mode">Latest reading</div></div>
        <div class="status"><span class="badge" id="badge"><i></i><span id="state"></span></span><div class="b" id="band"></div></div>
      </header>

      <div class="modules" id="modules" aria-label="Module condition"></div>

      <aside class="panel left"><h3>Temperature and pressure <span>drift</span></h3><div class="rows" id="rows-left"></div></aside>
      <aside class="panel right"><h3>Speed and flow <span>drift</span></h3><div class="rows" id="rows-right"></div></aside>

      <div class="events" id="events" aria-live="polite"></div>

      <footer class="bottom">
        <canvas id="timeline" aria-label="Predicted RUL and health score over the engine's recorded life; drag to scrub"></canvas>
        <div class="controls">
          <button class="btn primary" id="btn-play" title="Replay the recorded life from cycle 1 (Space)">Replay</button>
          <button class="btn" id="btn-latest" title="Jump to the latest reading">Latest</button>
          <div class="seg" id="speed" role="group" aria-label="Replay speed">
            <button class="btn" data-speed="0.5">0.5x</button><button class="btn on" data-speed="1">1x</button><button class="btn" data-speed="2">2x</button><button class="btn" data-speed="4">4x</button>
          </div>
          <span class="sep"></span>
          <button class="btn" id="btn-explode" title="Separate the engine modules (E)">Exploded view</button>
          <button class="btn" id="btn-rotate" title="Slowly rotate the camera">Auto-rotate</button>
          <button class="btn" id="btn-panels" title="Hide the sensor panels (H)">Hide panels</button>
          <span class="hint">Recorded history, replayed. Drag to orbit, scroll to zoom, click a sensor to focus.</span>
        </div>
      </footer>
      <div class="tooltip" id="tooltip"></div>
    </div>
  </div>
  <script src="./vendor/gsap.min.js"></script>
  <script type="module" src="./engine.js?v=3.0.2"></script>
</body>
</html>
